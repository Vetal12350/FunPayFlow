[project]
name = "funpayflow"
version = "1.0.0"
description = "FunPayFlow — автоматизация и аналитика для продавцов FunPay"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.7,<4",
    "FunPayAPI>=1.1.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "rich>=14,<15",
]

[project.scripts]
funpayflow = "main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "telegram.py",
    "funpay.py",
    "state.py",
    "feature_registry.py",
    "runtime_control.py",
    "runtime_events.py",
    "logger.py",
    "import_funpay_sales.py",
    "runtime_paths.py",
    "console_ui.py",
    "setup_config.py",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
