name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - name: Sync locked development environment
        run: uv sync --locked --dev
      - name: Full offline test suite
        run: uv run --no-sync pytest -q
      - name: Linux installer syntax
        if: runner.os == 'Linux'
        run: bash -n install.sh
      - name: Compile tracked Python source
        run: uv run --no-sync python -m compileall -q main.py telegram.py funpay.py state.py feature_registry.py runtime_control.py runtime_events.py runtime_paths.py logger.py import_funpay_sales.py setup_config.py render_service.py tests
      - name: Build and install wheel outside checkout
        run: uv run --no-sync python tests/packaging_smoke.py
